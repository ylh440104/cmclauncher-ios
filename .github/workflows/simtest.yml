name: simtest
on:
  workflow_dispatch:
    inputs:
      boot_seconds:
        description: seconds to keep app running
        default: "30"
jobs:
  sim:
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: fetch runtime payload
        run: |
          curl -sSL -o /tmp/app.ipa https://github.com/PojavLauncherTeam/PojavLauncher_iOS/releases/download/v2.2/net.kdt.pojavlauncher-2.2-ios.ipa
          mkdir -p /tmp/ipa
          unzip -q /tmp/app.ipa -d /tmp/ipa
          ls /tmp/ipa/Payload/PojavLauncher.app | head

      - name: build native
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cmake -B Natives/build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_OBJC_COMPILER=clang \
            -DCMAKE_ASM_COMPILER=clang \
            -DCONFIG_BRANCH=main -DCONFIG_COMMIT=ci -DCONFIG_RELEASE=0 \
            Natives
          cmake --build Natives/build -j 6

      - name: build java
        run: make -C JavaApp BOOTJDK="$(dirname "$(which javac)")"

      - name: assemble
        run: sh scripts/assemble.sh /tmp/ipa/Payload/PojavLauncher.app

      - name: convert to simulator platform
        run: |
          set +e
          find artifacts/Payload/CMCLauncher.app -type f | while read -r f; do
            if file -b "$f" | grep -q Mach-O; then
              xcrun vtool -arch arm64 -set-build-version 7 14.0 16.0 -replace -output "$f" "$f" >/dev/null 2>&1
              if [ $? -eq 0 ]; then
                codesign --force --sign - "$f" >/dev/null 2>&1
              fi
            fi
          done
          echo "platform conversion done"

      - name: boot and install
        run: |
          UDID=$(sh scripts/pick_device.sh)
          echo "device $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" artifacts/Payload/CMCLauncher.app

      - name: launch
        run: |
          set +e
          xcrun simctl launch "$SIM_UDID" com.cmc.launcher.ios
          sleep "${{ github.event.inputs.boot_seconds }}"
          xcrun simctl io "$SIM_UDID" screenshot /tmp/screen.png
          APP_DATA=$(xcrun simctl get_app_container "$SIM_UDID" com.cmc.launcher.ios data 2>/dev/null)
          if [ -n "$APP_DATA" ]; then
            cp "$APP_DATA/Library/Application Support/latestlog.txt" /tmp/latestlog.txt 2>/dev/null
          fi
          xcrun simctl spawn "$SIM_UDID" log show --last 2m --predicate 'processImagePath CONTAINS "CMCLauncher"' > /tmp/syslog.txt 2>/dev/null
          xcrun simctl terminate "$SIM_UDID" com.cmc.launcher.ios 2>/dev/null
          echo "=== app latestlog ==="
          head -c 4000 /tmp/latestlog.txt 2>/dev/null || echo "(no log file)"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simtest-output
          path: |
            /tmp/latestlog.txt
            /tmp/syslog.txt
            /tmp/screen.png
          if-no-files-found: warn